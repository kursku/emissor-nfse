name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Ubuntu esta na matriz de proposito: o projeto so foi exercitado no
    # Windows, e o contorno de OpenSSL legacy e especifico de la. O CI e o
    # primeiro sinal honesto de que o resto do codigo roda fora do Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # node:sqlite e embutido a partir do Node 24 — ver ADR-0006.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run patch:apply

      # typecheck + testes: o mesmo comando que o hook de pre-commit roda.
      - run: npm run check
